    <!-- Modern Tech Accent Pill -->
    <rect x="2" y="80" width="48" height="3" rx="1.5" fill="#FF6B4A"/>
    <circle cx="56" cy="81.5" r="2" fill="#DDF4E7"/>
    <circle cx="64" cy="81.5" r="1.5" fill="#FF6B4A"/>
