<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="100%" height="100%">
  <defs>
    <linearGradient id="iconBgGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A1E4D"/>
      <stop offset="100%" stop-color="#1F0E2A"/>
    </linearGradient>

    <linearGradient id="coralGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8264"/>
      <stop offset="50%" stop-color="#FF6B4A"/>
      <stop offset="100%" stop-color="#E04D2D"/>
    </linearGradient>

    <linearGradient id="mintGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#DDF4E7"/>
      <stop offset="100%" stop-color="#A8E2C1"/>
    </linearGradient>

    <linearGradient id="bezelBorderDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B4A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#DDF4E7" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- ICON SECTION -->
  <g transform="translate(6, 6) scale(0.44)">
    <rect x="12" y="12" width="176" height="176" rx="42" fill="url(#iconBgGradDark)" stroke="url(#bezelBorderDark)" stroke-width="3"/>
    
    <rect x="82" y="24" width="36" height="4" rx="2" fill="#DDF4E7" opacity="0.6"/>
    <circle cx="100" cy="38" r="3.5" fill="#1F0E2A" stroke="#FF6B4A" stroke-width="1.5"/>

    <path d="M 148 64 C 148 50 134 44 116 44 L 84 44 C 62 44 48 58 48 80 C 48 102 62 112 86 118 L 114 125 C 130 129 138 135 138 144 C 138 156 126 162 108 162 L 72 162 C 54 162 48 152 48 152" 
          fill="none" 
          stroke="url(#coralGradDark)" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <path d="M 148 64 C 148 50 134 44 116 44 L 98 44" fill="none" stroke="url(#mintGradDark)" stroke-width="5" stroke-linecap="round"/>
    <path d="M 102 162 L 72 162 C 54 162 48 152 48 152" fill="none" stroke="url(#mintGradDark)" stroke-width="5" stroke-linecap="round"/>

    <circle cx="152" cy="94" r="3.5" fill="#DDF4E7" opacity="0.9"/>
    <circle cx="158" cy="106" r="2.5" fill="#FF6B4A" opacity="0.8"/>
    <circle cx="152" cy="118" r="3.5" fill="#DDF4E7" opacity="0.9"/>

    <rect x="75" y="176" width="50" height="4" rx="2" fill="#DDF4E7" opacity="0.7"/>
  </g>

  <!-- TYPOGRAPHY SECTION (Dark Background Variant) -->
  <g transform="translate(108, 0)">
    <!-- Primary Wordmark: SANJANA MOBILES -->
    <text x="0" y="46" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#F8F6F0" letter-spacing="1.5">
