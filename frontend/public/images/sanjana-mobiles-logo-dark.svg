    </text>

    <!-- Subtitle: SMARTPHONES & ACCESSORIES -->
    <text x="2" y="70" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#DDF4E7" letter-spacing="3.5">
