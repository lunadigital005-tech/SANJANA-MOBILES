<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1A3B"/>
      <stop offset="100%" stop-color="#180C21"/>
    </linearGradient>

    <!-- Coral Tech Gradient -->
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8264"/>
      <stop offset="50%" stop-color="#FF6B4A"/>
      <stop offset="100%" stop-color="#E04D2D"/>
    </linearGradient>

    <!-- Mint Energy Gradient -->
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#DDF4E7"/>
      <stop offset="100%" stop-color="#A8E2C1"/>
    </linearGradient>

    <!-- Subtle Bezel Glow -->
    <linearGradient id="bezelBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B4A" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#DDF4E7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FF6B4A" stop-opacity="0.4"/>
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <filter id="coralGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Phone-Inspired Squircle Container -->
  <rect x="12" y="12" width="176" height="176" rx="42" fill="url(#bgGrad)" stroke="url(#bezelBorder)" stroke-width="2.5" filter="url(#softShadow)"/>

  <!-- Phone Screen Reflection Arc (Subtle) -->
  <path d="M 28 36 C 28 26 36 20 48 20 L 152 20 C 164 20 172 26 172 36 L 172 65 C 130 55 70 65 28 85 Z" fill="#FFFFFF" opacity="0.04"/>

  <!-- Top Mobile Speaker / Earpiece Pill -->
  <rect x="82" y="24" width="36" height="4" rx="2" fill="#DDF4E7" opacity="0.4"/>

  <!-- Punch Hole Camera Dot with Coral Ring -->
  <circle cx="100" cy="38" r="3.5" fill="#180C21" stroke="#FF6B4A" stroke-width="1.5"/>

  <!-- Master "S" Mobile Ribbon Construction -->
  <!-- Upper "S" Loop: Sleek Smartphone Display Sweep -->
  <path d="M 148 64 C 148 50 134 44 116 44 L 84 44 C 62 44 48 58 48 80 C 48 102 62 112 86 118 L 114 125 C 130 129 138 135 138 144 C 138 156 126 162 108 162 L 72 162 C 54 162 48 152 48 152" 
        fill="none" 
        stroke="url(#coralGrad)" 
        stroke-width="16" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#coralGlow)"/>

  <!-- Inner Dynamic Tech S-Core (Mint Accents) -->
  <path d="M 148 64 C 148 50 134 44 116 44 L 98 44" 
        fill="none" 
        stroke="url(#mintGrad)" 
        stroke-width="5" 
        stroke-linecap="round"/>

  <!-- Lower Tech Pulse Line (Mirror Accent) -->
  <path d="M 102 162 L 72 162 C 54 162 48 152 48 152" 
        fill="none" 
        stroke="url(#mintGrad)" 
        stroke-width="5" 
        stroke-linecap="round"/>

  <!-- Mobile Tech Nodes: High-Precision Connectivity Dots -->
  <circle cx="152" cy="94" r="3.5" fill="#DDF4E7" opacity="0.9"/>
  <circle cx="158" cy="106" r="2.5" fill="#FF6B4A" opacity="0.8"/>
  <circle cx="152" cy="118" r="3.5" fill="#DDF4E7" opacity="0.9"/>

  <!-- Bottom Home Bar / Gesture Indicator Pill -->
  <rect x="75" y="176" width="50" height="4" rx="2" fill="#DDF4E7" opacity="0.5"/>
</svg>
